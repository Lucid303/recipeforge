name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Build (with JEI support; falls back to a build without it)
        run: |
          if gradle build -Pjei --no-daemon; then
            echo "JEI SUPPORT: INCLUDED"
          else
            echo "JEI SUPPORT: NOT INCLUDED (the JEI build failed, building without it)"
            gradle build --no-daemon
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: worldforge-jar
          path: build/libs/*.jar
