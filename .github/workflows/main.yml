name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Build (tries everything, falls back to less if something cannot be built)
        run: |
          if gradle build -Pextras -Pjei -Pemi --no-daemon; then
            echo "BUILD RESULT: everything included (extra forges + JEI + EMI)"
          elif gradle build -Pextras --no-daemon; then
            echo "BUILD RESULT: extra forges included, JEI/EMI plugins NOT included"
          else
            echo "BUILD RESULT: core only (the extra forges could not be built)"
            gradle build --no-daemon
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: worldforge-jar
          path: build/libs/*.jar
