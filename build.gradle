plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.78'
}

version = project.mod_version
group = 'dev.recipeforge'

base {
    archivesName = project.mod_id
}

// "gradle jar -Pbrewing" builds the version that also supports the brewing stand.
if (project.hasProperty('brewing')) {
    sourceSets.main.java.srcDir 'src/brewing/java'
    base {
        archivesName = project.mod_id + '-brewing'
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

neoForge {
    version = project.neo_version
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
