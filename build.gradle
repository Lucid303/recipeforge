plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.78'
}

version = project.mod_version
group = 'dev.recipeforge'

base {
    archivesName = project.mod_id
}

repositories {
    maven { url = 'https://maven.blamejared.com/' }
    maven { url = 'https://modmaven.dev' }
}

// "gradle build -Pjei" also builds the JEI plugin, which shows custom anvil recipes in JEI.
if (project.hasProperty('jei')) {
    sourceSets.main.java.srcDir 'src/jei/java'
    dependencies {
        compileOnly "mezz.jei:jei-1.21.1-neoforge-api:19.+"
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

neoForge {
    version = project.neo_version
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
